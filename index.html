<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEW STORE — Robux & Roblox Services</title>
  <style>
    :root {
      --bg: #FFF5F5;
      --card: #FFFFFF;
      --primary: #C53030;
      --primary-dark: #9B2C2C;
      --soft: #FED7D7;
      --text: #1A202C;
      --muted: #718096;
      --border: #FEB2B2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(197, 48, 48, 0.22);
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.92;
      margin-top: 4px;
    }

    .container {
      max-width: 780px;
      margin: 20px auto;
      padding: 0 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(197, 48, 48, 0.06);
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    @media (min-width: 600px) {
      .tabs {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: #FFF5F5;
      color: var(--primary-dark);
      padding: 10px 8px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .packages {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .pkg {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      background: #fff;
      transition: 0.2s;
    }

    .pkg:hover, .pkg.selected {
      border-color: var(--primary);
      background: #FFF5F5;
    }

    .pkg .name {
      font-weight: 700;
      font-size: 0.98rem;
    }

    .pkg .price {
      color: var(--primary);
      font-weight: 800;
      font-size: 1.05rem;
      margin-top: 4px;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input, button {
      border-radius: 10px;
      font-size: 0.95rem;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .user-preview {
      display: none;
      align-items: center;
      gap: 10px;
      background: #FFF5F5;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .user-preview img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
    }

    .summary {
      background: #FFF5F5;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    /* Live Chat */
    .chat-fab {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(197, 48, 48, 0.35);
      cursor: pointer;
      z-index: 50;
    }

    .chat-box {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 72px;
      width: min(360px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
      overflow: hidden;
      z-index: 60;
    }

    .chat-header {
      background: var(--primary);
      color: #fff;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .chat-messages {
      height: 250px;
      overflow-y: auto;
      padding: 12px;
      background: #FFF5F5;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 82%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
    }

    .msg.admin {
      align-self: flex-start;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .chat-input {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid var(--border);
      background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>MEW STORE</h1>
    <p>សេវាកម្ម Robux, Gift Card & Roblox Services រហ័ស និងទុកចិត្ត</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>១. ជ្រើសរើសសេវាកម្ម និងកញ្ចប់</h2>
      <div class="tabs" id="serviceTabs">
        <button class="tab-btn active" data-service="Robux Send">Robux Send</button>
        <button class="tab-btn" data-service="Roblox Login">Roblox Login</button>
        <button class="tab-btn" data-service="Roblox Gift Card">Roblox Gift Card</button>
        <button class="tab-btn" data-service="Roblox Service">Roblox Service</button>
      </div>
      <div class="packages" id="packageList"></div>
    </section>

    <section class="card">
      <h2>២. ផ្ទៀងផ្ទាត់គណនី & បញ្ជាទិញ</h2>
      <div class="row">
        <input type="text" id="robloxUsername" placeholder="បញ្ចូល Roblox Username..." />
        <button class="btn" id="verifyBtn" type="button">ផ្ទៀងផ្ទាត់</button>
      </div>
      <div class="user-preview" id="userPreview">
        <img id="userAvatar" src="" alt="Avatar" />
        <div>
          <div id="verifiedName" style="font-weight:700;"></div>
          <div id="verifiedId" style="font-size:0.85rem; color:var(--muted);"></div>
        </div>
      </div>

      <div class="summary" id="orderSummary">
        សេវាកម្ម៖ <strong id="sumService">Robux Send</strong><br />
        កញ្ចប់៖ <strong id="sumPkg">10 Robux</strong><br />
        តម្លៃសរុប៖ <strong id="sumPrice" style="color:var(--primary);">$0.13</strong>
      </div>

      <button class="btn" id="orderChatBtn" style="width:100%;" type="button">
        ផ្ញើសំណើបញ្ជាទិញតាម Live Chat
      </button>
    </section>
  </main>

  <button class="chat-fab" id="chatToggle" type="button">💬 Live Chat</button>

  <div class="chat-box" id="chatBox">
    <div class="chat-header">
      <span>MEW STORE Live Chat</span>
      <button id="chatClose" style="background:none;border:none;color:#fff;font-size:1.1rem;cursor:pointer;">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg admin">សួស្តីបង! ត្រូវការជំនួយផ្នែក Robux ឬសេវាកម្មណា អាចផ្ញើសារមកទីនេះបាន។</div>
    </div>
    <form class="chat-input" id="chatForm">
      <input type="text" id="chatInput" placeholder="វាយសាររបស់បង..." required />
      <button class="btn" type="submit">ផ្ញើ</button>
    </form>
  </div>

  <script>
    const API_BASE_URL = "https://mew-store.onrender.com";

    const PACKAGES = {
      "Robux Send": [
        { name: "10 Robux", price: "$0.13" },
        { name: "100 Robux", price: "$0.99" }
      ],
      "Roblox Login": [
        { name: "80 Robux", price: "$0.98" },
        { name: "500 Robux", price: "$4.85" },
        { name: "1,000 Robux", price: "$9.50" },
        { name: "2,000 Robux", price: "$18.99" }
      ],
      "Roblox Gift Card": [
        { name: "$5 Gift Card", price: "$5.20" },
        { name: "$10 Gift Card", price: "$10.30" }
      ],
      "Roblox Service": [
        { name: "ដោះSelect", price: "$1.00" },
        { name: "ដោះunchecked+Select", price: "$1.50" },
        { name: "Plus 7day", price: "$2.00" }
      ]
    };

    let currentService = "Robux Send";
    let selectedPkg = PACKAGES["Robux Send"][0];
    let verifiedUsername = "";

    const packageListEl = document.getElementById("packageList");
    const sumServiceEl = document.getElementById("sumService");
    const sumPkgEl = document.getElementById("sumPkg");
    const sumPriceEl = document.getElementById("sumPrice");

    function updateSummary() {
      sumServiceEl.textContent = currentService;
      sumPkgEl.textContent = selectedPkg.name;
      sumPriceEl.textContent = selectedPkg.price;
    }

    function renderPackages() {
      const list = PACKAGES[currentService] || [];
      selectedPkg = list[0];
      packageListEl.innerHTML = "";

      list.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "pkg" + (idx === 0 ? " selected" : "");
        div.innerHTML = `<div class="name">${item.name}</div><div class="price">${item.price}</div>`;
        div.addEventListener("click", () => {
          document.querySelectorAll(".pkg").forEach(el => el.classList.remove("selected"));
          div.classList.add("selected");
          selectedPkg = item;
          updateSummary();
        });
        packageListEl.appendChild(div);
      });
      updateSummary();
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentService = btn.dataset.service;
        renderPackages();
      });
    });

    document.getElementById("verifyBtn").addEventListener("click", async () => {
      const username = document.getElementById("robloxUsername").value.trim();
      if (!username) return alert("សូមបញ្ចូល Roblox Username ជាមុនសិន!");

      try {
        const res = await fetch("https://users.roblox.com/v1/usernames/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
        });
        const data = await res.json();
        const user = data.data && data.data[0];
        if (!user) {
          alert("រកមិនឃើញគណនី Roblox ឈ្មោះនេះទេ!");
          return;
        }

        verifiedUsername = user.name;
        document.getElementById("verifiedName").textContent = `${user.displayName} (@${user.name})`;
        document.getElementById("verifiedId").textContent = `User ID: ${user.id}`;
        document.getElementById("userAvatar").src =
          `https://www.roblox.com/headshot-thumbnail/image?userId=${user.id}&width=150&height=150&format=png`;
        document.getElementById("userPreview").style.display = "flex";
      } catch (err) {
        alert("មានបញ្ហាពេលផ្ទៀងផ្ទាត់ Username!");
      }
    });

    // Live Chat Logic
    const sessionId = localStorage.getItem("mew_chat_session") || ("mew_" + Math.random().toString(36).slice(2, 10));
    localStorage.setItem("mew_chat_session", sessionId);
    let lastPollTime = 0;

    const chatBox = document.getElementById("chatBox");
    const chatMessages = document.getElementById("chatMessages");

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendChatMessage(text) {
      appendMessage(text, "user");
      try {
        await fetch(`${API_BASE_URL}/api/chat/send`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, message: text })
        });
      } catch (err) {
        appendMessage("មិនអាចផ្ញើសារទៅ Server បានទេ។", "admin");
      }
    }

    setInterval(async () => {
      try {
        const res = await fetch(`${API_BASE_URL}/api/chat/poll?sessionId=${encodeURIComponent(sessionId)}&after=${lastPollTime}`);
        const data = await res.json();
        if (Array.isArray(data.messages)) {
          data.messages.forEach(m => {
            appendMessage(m.text, "admin");
            if (m.time > lastPollTime) lastPollTime = m.time;
          });
        }
      } catch (_) {}
    }, 2500);

    document.getElementById("chatToggle").addEventListener("click", () => {
      chatBox.style.display = chatBox.style.display === "block" ? "none" : "block";
    });
    document.getElementById("chatClose").addEventListener("click", () => {
      chatBox.style.display = "none";
    });

    document.getElementById("chatForm").addEventListener("submit", e => {
      e.preventDefault();
      const input = document.getElementById("chatInput");
      const val = input.value.trim();
      if (!val) return;
      input.value = "";
      sendChatMessage(val);
    });

    document.getElementById("orderChatBtn").addEventListener("click", () => {
      const uname = verifiedUsername || document.getElementById("robloxUsername").value.trim() || "មិនទាន់បញ្ជាក់";
      chatBox.style.display = "block";
      sendChatMessage(`បញ្ជាទិញ: ${currentService} | កញ្ចប់: ${selectedPkg.name} (${selectedPkg.price}) | Username: ${uname}`);
    });

    renderPackages();
  </script>
</body>
</html>
