<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEW STORE — Robux & Roblox Services</title>
  <style>
    :root {
      --bg: #FFF5F5;
      --card: #FFFFFF;
      --primary: #C53030;
      --primary-dark: #9B2C2C;
      --soft: #FED7D7;
      --text: #1A202C;
      --muted: #718096;
      --border: #FEB2B2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 95px;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(197, 48, 48, 0.22);
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.92;
      margin-top: 4px;
    }

    .container {
      max-width: 780px;
      margin: 20px auto;
      padding: 0 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(197, 48, 48, 0.06);
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    @media (min-width: 600px) {
      .tabs {
        grid-template-columns: repeat(4, 1fr);
      }
    }
